send_meter_reading:
  name: Отправить показания
  description: >-
    Передаёт показания счётчика в личный кабинет ЕИРЦ. Идентификаторы тарифов
    (scale_id) берутся из атрибутов сенсора счётчика.
  fields:
    entity_id:
      name: Сенсор счётчика
      description: Сенсор показаний любого тарифа этого счётчика.
      required: true
      example: sensor.ivan_els_71000000001_hot_water_111111
      selector:
        entity:
          domain: sensor
          integration: eirc_spb
    readings:
      name: Показания
      description: >-
        Список показаний: scale_id (id тарифа из атрибутов сенсора) и value
        (передаваемое показание).
      required: true
      example:
        - value: 12345
    confirm:
      name: Подтвердить
      description: >-
        Отправить показания, даже если сервер предупреждает о необычном расходе.
      example: "true"
download_bill:
  name: Скачать счёт (ЕПД)
  description: >-
    Скачивает PDF текущего или указанного счёта в каталог www Home Assistant.
  fields:
    entity_id:
      name: Сущность
      description: Сенсор текущего счёта (…_current_bill).
      required: true
      example: sensor.eirc_spb_1000000001_current_bill
      selector:
        entity:
          integration: eirc_spb
          domain: sensor
    bill_id:
      name: Номер счёта
      description: По умолчанию — текущий счёт.
      example: "26071000000001"
    path:
      name: Путь файла
      description: Абсолютный путь внутри каталога конфигурации Home Assistant.
      example: /config/www/eirc/bill.pdf
